<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>GalenoSV - Pruebas unitarias TDD</title>
    <link rel="stylesheet" href="lib/mocha/mocha.css">
</head>

<body>
    <div id="mocha"></div>
    <script src="lib/mocha/mocha.js"></script>
    <script src="lib/sinon/sinon.js"></script>
    <script>
        // Cada suite configura la interfaz de Mocha; elevamos el límite para evitar MaxListenersExceededWarning.
        mocha.suite.setMaxListeners(30);
    </script>
    <!-- Unitarias TDD con stubs; la integración BDD usa fetch real contra Open Liberty. -->
    <script type="module">
        // Un único módulo garantiza que todas las suites se registren antes de ejecutar Mocha.
        import "./control/default_service_test.js";
        import "./control/persona_service_test.js";
        import "./control/consulta_service_test.js";
        import "./control/auth_service_test.js";
        import "./control/router_test.js";
        import "./control/orden_examen_service_test.js";
        import "./control/generador_mensajes_test.js";

        // HU1, HU2 y componentes compartidos: importar cada suite una sola vez.
        import "./control/busqueda_citas_view_test.js";
        import "./control/login_view_test.js";
        import "./control/tarjeta_consulta_test.js";
        import "./control/historial_pasos_test.js";
        import "./boundary/asistente_busqueda_test.js";
        import "./boundary/encabezado_app_test.js";
        import "./boundary/menu_lateral_test.js";

        import "./boundary/dashboard_view_test.js";
        import "./boundary/stepper_progreso_test.js";
        import "./control/atencion_consulta_view_test.js";
        import "./boundary/autocomplete_cie10_test.js";
        import "./boundary/lista_examenes_test.js";
        import "./boundary/estado_red_test.js";

        // BDD de integración con fetch real: se importa al final porque cambia la interfaz de Mocha a BDD.
        import "./integration/consulta_service_it.js";

        mocha.run();
    </script>
</body>

</html>
